<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#F0F9FF"/>
  <circle cx="160" cy="90" r="70" fill="#E0F2FE"/>
  <!-- Flowchart nodes for Student Proposal -->
  <rect x="50" y="70" width="60" height="34" rx="6" fill="#0284C7"/>
  <text x="80" y="88" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PROPOSAL</text>
  <text x="80" y="96" font-family="system-ui, sans-serif" font-size="6" fill="#BAE6FD" text-anchor="middle">MAHASISWA</text>
  
  <!-- Arrow 1 -->
  <line x1="110" y1="87" x2="135" y2="87" stroke="#0369A1" stroke-width="2.5" stroke-dasharray="3 2"/>
  <polygon points="135,84 141,87 135,90" fill="#0369A1"/>
  
  <!-- Decision Diamond -->
  <polygon points="160,65 185,87 160,109 135,87" fill="#F59E0B"/>
  <text x="160" y="89" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">REVIEW</text>
  
  <!-- Arrow 2 -->
  <line x1="185" y1="87" x2="210" y2="87" stroke="#0369A1" stroke-width="2.5"/>
  <polygon points="210,84 216,87 210,90" fill="#0369A1"/>
  
  <!-- Final Node -->
  <rect x="216" y="70" width="60" height="34" rx="6" fill="#10B981"/>
  <text x="246" y="88" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">APPROVED</text>
  <text x="246" y="96" font-family="system-ui, sans-serif" font-size="6" fill="#D1FAE5" text-anchor="middle">ANGGARAN</text>

  <!-- Title Badge -->
  <g transform="translate(85, 135)">
    <rect width="150" height="20" rx="5" fill="#0369A1"/>
    <text x="75" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">USER FLOW &amp; SATUUNMAS</text>
  </g>
</svg>