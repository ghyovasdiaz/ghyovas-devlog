    <rect width="150" height="20" rx="5" fill="#6B21A8"/>
    <text x="75" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">USER GUIDE UNMAS FINAL</text>
