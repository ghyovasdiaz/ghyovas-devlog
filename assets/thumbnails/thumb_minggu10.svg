<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#FAF5FF"/>
  <circle cx="160" cy="90" r="70" fill="#F3E8FF"/>
  <!-- User Guide Book / Document -->
  <rect x="110" y="45" width="100" height="85" rx="6" fill="#FFFFFF" stroke="#C084FC" stroke-width="2"/>
  <!-- Book Spine / Header -->
  <rect x="110" y="45" width="22" height="85" fill="#7E22CE" rx="4"/>
  <line x1="120" y1="55" x2="120" y2="120" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Content Lines on Book Page -->
  <rect x="140" y="58" width="55" height="5" rx="2.5" fill="#9333EA"/>
  <rect x="140" y="68" width="60" height="3" rx="1.5" fill="#C084FC"/>
  <rect x="140" y="75" width="50" height="3" rx="1.5" fill="#D8B4FE"/>
  <rect x="140" y="82" width="58" height="3" rx="1.5" fill="#E9D5FF"/>
  <!-- Flow diagram snippet in book -->
  <rect x="140" y="93" width="22" height="12" rx="2" fill="#7E22CE"/>
