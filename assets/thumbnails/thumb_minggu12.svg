<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#F1F5F9"/>
  <circle cx="160" cy="90" r="70" fill="#E2E8F0"/>
  <!-- Architecture / Technical Flowmap -->
  <!-- Client layer -->
  <rect x="60" y="55" width="55" height="30" rx="4" fill="#3B82F6"/>
  <text x="87" y="73" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CLIENT</text>

  <!-- Connect line -->
  <line x1="115" y1="70" x2="135" y2="70" stroke="#64748B" stroke-width="2"/>

  <!-- API Server -->
  <rect x="135" y="50" width="55" height="40" rx="4" fill="#1E293B"/>
  <text x="162" y="68" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#38BDF8" text-anchor="middle">API / SIM</text>
  <text x="162" y="78" font-family="system-ui, sans-serif" font-size="6" fill="#94A3B8" text-anchor="middle">SERVER</text>

  <!-- Connect line -->
  <line x1="190" y1="70" x2="210" y2="70" stroke="#64748B" stroke-width="2"/>

  <!-- Database MySQL -->
  <rect x="210" y="55" width="55" height="30" rx="4" fill="#0D9488"/>
  <text x="237" y="73" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DATABASE</text>

  <!-- Sub layers / Flow lines down -->
  <line x1="162" y1="90" x2="162" y2="108" stroke="#64748B" stroke-width="2" stroke-dasharray="2 2"/>
  <rect x="125" y="108" width="74" height="22" rx="4" fill="#475569"/>
  <text x="162" y="122" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">AUTH &amp; VALIDASI</text>

  <!-- Badge -->
  <g transform="translate(70, 142)">
    <rect width="180" height="20" rx="5" fill="#0F172A"/>
    <text x="90" y="14" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FLOWMAP SISI TEKNIS SISTEM</text>
  </g>
</svg>