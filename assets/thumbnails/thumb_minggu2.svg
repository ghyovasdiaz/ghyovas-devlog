<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" fill="#E8F7F0"/>
  <circle cx="160" cy="90" r="70" fill="#D6F0E3"/>
  <!-- Central Desktop Monitor with Vue -->
  <rect x="110" y="40" width="100" height="70" rx="6" fill="#1E293B"/>
  <rect x="114" y="44" width="92" height="62" rx="4" fill="#0F172A"/>
  <!-- Vue.js Logo inside Monitor -->
  <g transform="translate(138, 55) scale(0.44)">
    <path fill="#42B883" d="M60.3 8.3L50 26.1 39.7 8.3H3.6L50 88.7 96.4 8.3H60.3z"/>
    <path fill="#35495E" d="M60.3 8.3L50 26.1 39.7 8.3h-19L50 59.3 79.3 8.3h-19z"/>
  </g>
  <!-- API endpoints badge -->
  <rect x="122" y="93" width="76" height="8" rx="4" fill="#334155"/>
  <text x="160" y="99" font-family="monospace" font-size="6" fill="#34D399" text-anchor="middle">GET /api/v1/posts</text>
  <!-- Stand -->
  <rect x="154" y="110" width="12" height="20" fill="#475569"/>
  <rect x="142" y="130" width="36" height="4" rx="2" fill="#334155"/>
  <!-- Developer person standing on the right -->
  <!-- Head -->
  <circle cx="230" cy="72" r="9" fill="#FBCFE8"/>
  <path d="M222 70 C222 62, 238 62, 238 70 Z" fill="#065F46"/>
  <!-- Body / Shirt -->
  <rect x="223" y="81" width="14" height="28" rx="4" fill="#059669"/>
  <!-- Legs -->
  <line x1="226" y1="109" x2="226" y2="140" stroke="#1F2937" stroke-width="4"/>
  <line x1="234" y1="109" x2="234" y2="140" stroke="#1F2937" stroke-width="4"/>
  <!-- Floating REST badge left -->
  <g transform="translate(68, 65)">
    <rect width="36" height="18" rx="4" fill="#10B981"/>
    <text x="18" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">REST</text>
  </g>
  <!-- Floating JSON badge -->
  <g transform="translate(62, 95)">
    <rect width="42" height="16" rx="4" fill="#047857"/>
    <text x="21" y="11" font-family="monospace" font-size="7" font-weight="bold" fill="#A7F3D0" text-anchor="middle">{ JSON }</text>
  </g>
</svg>